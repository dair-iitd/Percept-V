<!DOCTYPE html>

<title>Percept-V: Can Multimodal LLMs Crack Simple Perception Problems?</title>
<meta name="description" content="Percept-V is a benchmark of 6,000 program-generated images across 30 domains grounded in the TVPS-4 framework, testing the basic visual perception of multimodal LLMs.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁️</text></svg>">
<style>

  body {

    background: #fff; color: #1a1c20; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 640px; text-align: center; }
  .venue {
    display: inline-block; margin: 0 0 20px; font-size: 12px; font-weight: 600;

    display: inline-block; background: #1a1c20; color: #fff; text-decoration: none;
    padding: 9px 20px; border-radius: 999px; font-size: 15px;
  }
  .links a:hover { opacity: .85; }
  .soon {
    margin: 32px 0 0; padding-top: 24px; border-top: 1px solid #e3e6ea;
    color: #868b93; font-size: 14.5px;
  }
  @media (prefers-color-scheme: dark) {

<main>

  </p>
  <p class="affil">Indian Institute of Technology, Delhi</p>
